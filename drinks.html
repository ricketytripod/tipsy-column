<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Tipsy Column — Drinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1208;
      --cream: #f5f0e8;
      --parchment: #ede6d6;
      --amber: #b8640a;
      --amber-pale: #fdf3e3;
      --rule: #c4a96b;
      --muted: #7a6a52;
      --success: #2d6a3f;
      --success-bg: #eaf4ed;
      --error: #8b2a2a;
      --error-bg: #fdf0f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(196,169,107,0.12) 28px),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8640a' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .page-wrap { max-width: 540px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    /* Header */
    .header { text-align: center; padding: 2.5rem 0 2rem; border-bottom: 2px solid var(--rule); margin-bottom: 2rem; position: relative; }
    .header::before { content: '◆'; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--rule); background: var(--cream); padding: 0 8px; }
    .header-eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; font-weight: 500; }
    .header-title { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 8vw, 3rem); font-weight: 700; color: var(--ink); line-height: 1.1; letter-spacing: -0.01em; }
    .header-title span { color: var(--amber); }
    .header-tagline { margin-top: 0.75rem; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); font-style: italic; }

    /* Cards */
    .card { background: #fffef9; border: 1px solid var(--rule); border-radius: 2px; padding: 1.75rem 1.5rem; margin-bottom: 1.25rem; box-shadow: 3px 3px 0 rgba(184,100,10,0.08); }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; color: var(--ink); margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--parchment); display: flex; align-items: center; gap: 8px; }

    /* Name input */
    .field-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 6px; display: block; }
    input[type="text"] { width: 100%; padding: 10px 14px; background: var(--amber-pale); border: 1px solid var(--rule); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    input[type="text"]:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(184,100,10,0.1); }

    /* Menu items */
    .menu-item { border: 1px solid var(--parchment); border-radius: 2px; padding: 1rem; margin-bottom: 10px; background: var(--amber-pale); transition: border-color 0.15s; }
    .menu-item:last-child { margin-bottom: 0; }
    .menu-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .menu-item-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; color: var(--ink); }
    .menu-item-price { font-size: 13px; color: var(--amber); font-weight: 500; letter-spacing: 0.04em; }
    .menu-item-desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-style: italic; }

    /* Qty */
    .qty-row { display: flex; align-items: center; gap: 10px; }
    .qty-label { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; min-width: 48px; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 30px; height: 30px; border: 1px solid var(--rule); background: #fffef9; border-radius: 2px; cursor: pointer; font-size: 16px; color: var(--amber); font-weight: 500; display: flex; align-items: center; justify-content: center; transition: background 0.1s; font-family: 'DM Sans', sans-serif; }
    .qty-btn:hover { background: var(--parchment); }
    .qty-btn:active { transform: scale(0.95); }
    .qty-val { font-size: 16px; font-weight: 500; min-width: 24px; text-align: center; color: var(--ink); font-family: 'Playfair Display', serif; }

    /* Custom item */
    .custom-item { border: 1px dashed var(--rule); border-radius: 2px; padding: 1rem; margin-bottom: 10px; background: #fffef9; }
    .custom-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
    .custom-row .field-group { flex: 1; min-width: 120px; }
    .custom-row .field-group.price-group { max-width: 100px; }
    .custom-row input[type="text"] { font-size: 14px; padding: 8px 10px; }
    .add-custom-btn { width: 100%; padding: 10px; background: none; border: 1px dashed var(--rule); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--muted); cursor: pointer; letter-spacing: 0.06em; transition: background 0.15s, color 0.15s; margin-top: 2px; }
    .add-custom-btn:hover { background: var(--amber-pale); color: var(--amber); border-color: var(--amber); }
    .remove-custom-btn { padding: 8px 12px; background: none; border: 1px solid var(--rule); border-radius: 2px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; font-family: 'DM Sans', sans-serif; align-self: flex-end; }
    .remove-custom-btn:hover { background: var(--error-bg); color: var(--error); border-color: #e8b4b4; }

    /* Summary */
    .summary { background: var(--parchment); border: 1px solid var(--rule); border-radius: 2px; padding: 1rem 1.25rem; margin-top: 1rem; display: none; }
    .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 3px 0; }
    .summary-divider { border: none; border-top: 1px solid var(--rule); margin: 8px 0; }
    .summary-total { display: flex; justify-content: space-between; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; color: var(--ink); }

    /* Submit */
    .submit-btn { width: 100%; padding: 14px; background: var(--amber); color: #fffef9; border: none; border-radius: 2px; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; cursor: pointer; letter-spacing: 0.04em; transition: background 0.15s, transform 0.1s; margin-top: 0.5rem; }
    .submit-btn:hover { background: #9a5208; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Messages */
    .msg { border-radius: 2px; padding: 12px 16px; font-size: 14px; margin-bottom: 1rem; display: none; }
    .msg-success { background: var(--success-bg); color: var(--success); border: 1px solid #a3d4b0; }
    .msg-error { background: var(--error-bg); color: var(--error); border: 1px solid #e8b4b4; }
    .footer-rule { text-align: center; margin-top: 3rem; color: var(--rule); font-size: 13px; letter-spacing: 0.2em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,254,249,0.4); border-top-color: #fffef9; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  </style>
</head>
<body>
<div class="page-wrap">

  <header class="header">
    <div class="header-eyebrow">Est. 2026 &bull; Back of the Office</div>
    <h1 class="header-title">The Tipsy<br><span>Column</span></h1>
    <div class="header-tagline">Drinks order — you didn't hear it from us</div>
  </header>

  <div id="msg-success" class="msg msg-success"></div>
  <div id="msg-error" class="msg msg-error"></div>

  <div class="card">
    <div class="card-title"><span>✦</span> Your name</div>
    <label class="field-label" for="person-name">First name</label>
    <input type="text" id="person-name" placeholder="e.g. James" autocomplete="given-name" />
  </div>

  <div class="card">
    <div class="card-title"><span>✦</span> From the bar</div>

    <!-- Beer -->
    <div class="menu-item">
      <div class="menu-item-header">
        <div class="menu-item-name">Beer</div>
        <div class="menu-item-price">$4.00 each</div>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="change('beer',-1)" aria-label="Remove beer">−</button>
          <span class="qty-val" id="qty-beer">0</span>
          <button class="qty-btn" onclick="change('beer',1)" aria-label="Add beer">+</button>
        </div>
      </div>
    </div>

    <!-- Cider -->
    <div class="menu-item">
      <div class="menu-item-header">
        <div class="menu-item-name">Cider</div>
        <div class="menu-item-price">$4.00 each</div>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="change('cider',-1)" aria-label="Remove cider">−</button>
          <span class="qty-val" id="qty-cider">0</span>
          <button class="qty-btn" onclick="change('cider',1)" aria-label="Add cider">+</button>
        </div>
      </div>
    </div>

    <!-- Non-alcoholic -->
    <div class="menu-item">
      <div class="menu-item-header">
        <div class="menu-item-name">Non-alcoholic</div>
        <div class="menu-item-price">$4.00 each</div>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="change('na',-1)" aria-label="Remove non-alcoholic">−</button>
          <span class="qty-val" id="qty-na">0</span>
          <button class="qty-btn" onclick="change('na',1)" aria-label="Add non-alcoholic">+</button>
        </div>
      </div>
    </div>

  </div>

  <div class="summary" id="order-summary">
    <div id="summary-lines"></div>
    <hr class="summary-divider" />
    <div class="summary-total">
      <span>Total</span>
      <span id="summary-total-val">$0.00</span>
    </div>
  </div>

  <button class="submit-btn" id="submit-btn" onclick="submitOrder()">Place my order →</button>

  <div class="footer-rule">◆ &nbsp; ◆ &nbsp; ◆</div>
</div>

<script>
  // !! REPLACE THIS with your Google Apps Script Web App URL after setup !!
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGFjUfFeWa4yM8uSbinYQTsZ9DRloF49zjJkrmumH0dvrAzFe5t0UyWvg9W8Zy55LN/exec';

  const baseItems = {
    beer:  { label: 'Beer',           price: 4.00 },
    cider: { label: 'Cider',          price: 4.00 },
    na:    { label: 'Non-alcoholic',  price: 4.00 }
  };
  const qty = { beer: 0, cider: 0, na: 0 };
  let customItems = []; // { id, label, price, qty }
  let customCounter = 0;

  function change(key, delta) {
    qty[key] = Math.max(0, qty[key] + delta);
    document.getElementById('qty-' + key).textContent = qty[key];
    updateSummary();
  }

  function changeCustom(id, delta) {
    const item = customItems.find(i => i.id === id);
    if (!item) return;
    item.qty = Math.max(0, item.qty + delta);
    document.getElementById('cqty-' + id).textContent = item.qty;
    updateSummary();
  }

  function addCustomItem() {
    const id = ++customCounter;
    customItems.push({ id, label: '', price: 4.00, qty: 0 });

    const container = document.getElementById('custom-items');
    const div = document.createElement('div');
    div.className = 'custom-item';
    div.id = 'custom-' + id;
    div.innerHTML = `
      <div class="custom-row">
        <div class="field-group">
          <label class="field-label">Item name</label>
          <input type="text" id="clabel-${id}" placeholder="e.g. Sparkling water" oninput="updateCustomLabel(${id})" />
        </div>
        <div class="field-group price-group">
          <label class="field-label">Price ($)</label>
          <input type="text" id="cprice-${id}" value="4.00" oninput="updateCustomPrice(${id})" style="text-align:right" />
        </div>
        <button class="remove-custom-btn" onclick="removeCustomItem(${id})">Remove</button>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeCustom(${id},-1)" aria-label="Remove item">−</button>
          <span class="qty-val" id="cqty-${id}">0</span>
          <button class="qty-btn" onclick="changeCustom(${id},1)" aria-label="Add item">+</button>
        </div>
      </div>`;
    container.appendChild(div);
    document.getElementById('clabel-' + id).focus();
    updateSummary();
  }

  function updateCustomLabel(id) {
    const item = customItems.find(i => i.id === id);
    if (item) item.label = document.getElementById('clabel-' + id).value.trim();
    updateSummary();
  }

  function updateCustomPrice(id) {
    const item = customItems.find(i => i.id === id);
    if (!item) return;
    const val = parseFloat(document.getElementById('cprice-' + id).value);
    item.price = isNaN(val) ? 0 : val;
    updateSummary();
  }

  function removeCustomItem(id) {
    customItems = customItems.filter(i => i.id !== id);
    const el = document.getElementById('custom-' + id);
    if (el) el.remove();
    updateSummary();
  }

  function updateSummary() {
    let total = 0, hasAny = false, lines = '';

    Object.keys(baseItems).forEach(k => {
      const q = qty[k];
      if (q > 0) {
        hasAny = true;
        const sub = q * baseItems[k].price;
        total += sub;
        lines += `<div class="summary-row"><span>${q}× ${baseItems[k].label}</span><span>$${sub.toFixed(2)}</span></div>`;
      }
    });

    customItems.forEach(item => {
      if (item.qty > 0) {
        hasAny = true;
        const label = item.label || 'Custom item';
        const sub = item.qty * item.price;
        total += sub;
        lines += `<div class="summary-row"><span>${item.qty}× ${label}</span><span>$${sub.toFixed(2)}</span></div>`;
      }
    });

    document.getElementById('summary-lines').innerHTML = lines;
    document.getElementById('summary-total-val').textContent = '$' + total.toFixed(2);
    document.getElementById('order-summary').style.display = hasAny ? 'block' : 'none';
  }

  async function submitOrder() {
    const name = document.getElementById('person-name').value.trim();
    if (!name) { document.getElementById('person-name').focus(); showMsg('error', 'Please enter your name.'); return; }

    const baseSelected = Object.keys(qty).some(k => qty[k] > 0);
    const customSelected = customItems.some(i => i.qty > 0);
    if (!baseSelected && !customSelected) { showMsg('error', 'Please select at least one drink.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Placing order...';

    // Build a readable order string for the sheet
    const orderParts = [];
    Object.keys(baseItems).forEach(k => {
      if (qty[k] > 0) orderParts.push(`${qty[k]}× ${baseItems[k].label}`);
    });
    customItems.forEach(item => {
      if (item.qty > 0) orderParts.push(`${item.qty}× ${item.label || 'Custom'} ($${item.price.toFixed(2)})`);
    });

    const totalVal = Object.keys(qty).reduce((s,k) => s + qty[k]*baseItems[k].price, 0)
                   + customItems.reduce((s,i) => s + i.qty*i.price, 0);

    const order = {
      name,
      beer: qty.beer,
      cider: qty.cider,
      nonAlcoholic: qty.na,
      customItems: customItems.filter(i => i.qty > 0).map(i => `${i.qty}× ${i.label||'Custom'} @$${i.price.toFixed(2)}`).join('; '),
      orderSummary: orderParts.join(', '),
      total: totalVal.toFixed(2),
      timestamp: new Date().toLocaleString('en-CA', { timeZone: 'America/Toronto' })
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(order)
      });
      showMsg('success', '✓ Order received — see you Friday!');
      // Reset
      Object.keys(qty).forEach(k => { qty[k] = 0; document.getElementById('qty-'+k).textContent = 0; });
      customItems = [];
      document.getElementById('custom-items').innerHTML = '';
      document.getElementById('person-name').value = '';
      document.getElementById('order-summary').style.display = 'none';
      btn.style.display = 'none';
    } catch(e) {
      showMsg('error', 'Something went wrong. Please try again.');
      btn.disabled = false;
      btn.innerHTML = 'Place my order →';
    }
  }

  function showMsg(type, text) {
    ['success','error'].forEach(t => {
      const el = document.getElementById('msg-' + t);
      el.style.display = t === type ? 'block' : 'none';
      if (t === type) el.textContent = text;
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
