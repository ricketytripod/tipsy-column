<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Tipsy Column</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1208;
      --cream: #f5f0e8;
      --parchment: #ede6d6;
      --amber: #b8640a;
      --amber-light: #e8a44a;
      --amber-pale: #fdf3e3;
      --rule: #c4a96b;
      --muted: #7a6a52;
      --success: #2d6a3f;
      --success-bg: #eaf4ed;
      --error: #8b2a2a;
      --error-bg: #fdf0f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(196,169,107,0.12) 28px),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8640a' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .page-wrap { max-width: 540px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .header {
      text-align: center;
      padding: 2.5rem 0 2rem;
      border-bottom: 2px solid var(--rule);
      margin-bottom: 2rem;
      position: relative;
    }
    .header::before {
      content: '◆';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--rule);
      background: var(--cream);
      padding: 0 8px;
    }
    .header-eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; font-weight: 500; }
    .header-title { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 8vw, 3rem); font-weight: 700; color: var(--ink); line-height: 1.1; letter-spacing: -0.01em; }
    .header-title span { color: var(--amber); }
    .header-tagline { margin-top: 0.75rem; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); font-style: italic; }
    .card { background: #fffef9; border: 1px solid var(--rule); border-radius: 2px; padding: 1.75rem 1.5rem; margin-bottom: 1.25rem; box-shadow: 3px 3px 0 rgba(184,100,10,0.08); }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; color: var(--ink); margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--parchment); display: flex; align-items: center; gap: 8px; }
    .field-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 6px; display: block; }
    input[type="text"] { width: 100%; padding: 10px 14px; background: var(--amber-pale); border: 1px solid var(--rule); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    input[type="text"]:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(184,100,10,0.1); }
    .menu-item { border: 1px solid var(--parchment); border-radius: 2px; padding: 1rem; margin-bottom: 10px; background: var(--amber-pale); }
    .menu-item:last-child { margin-bottom: 0; }
    .menu-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .menu-item-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; color: var(--ink); }
    .menu-item-price { font-size: 13px; color: var(--amber); font-weight: 500; letter-spacing: 0.04em; }
    .qty-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .qty-label { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; min-width: 48px; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 30px; height: 30px; border: 1px solid var(--rule); background: #fffef9; border-radius: 2px; cursor: pointer; font-size: 16px; color: var(--amber); font-weight: 500; display: flex; align-items: center; justify-content: center; transition: background 0.1s; font-family: 'DM Sans', sans-serif; }
    .qty-btn:hover { background: var(--parchment); }
    .qty-btn:active { transform: scale(0.95); }
    .qty-val { font-size: 16px; font-weight: 500; min-width: 24px; text-align: center; color: var(--ink); font-family: 'Playfair Display', serif; }
    .options-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .option-chip { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .option-chip input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--amber); cursor: pointer; }
    .option-chip span { font-size: 13px; color: var(--muted); }
    .option-chip:hover span { color: var(--ink); }
    .summary { background: var(--parchment); border: 1px solid var(--rule); border-radius: 2px; padding: 1rem 1.25rem; margin-top: 1rem; display: none; }
    .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 3px 0; }
    .summary-row.detail { padding-left: 12px; font-size: 12px; font-style: italic; }
    .summary-divider { border: none; border-top: 1px solid var(--rule); margin: 8px 0; }
    .summary-total { display: flex; justify-content: space-between; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; color: var(--ink); }
    .submit-btn { width: 100%; padding: 14px; background: var(--amber); color: #fffef9; border: none; border-radius: 2px; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; cursor: pointer; letter-spacing: 0.04em; transition: background 0.15s, transform 0.1s; margin-top: 0.5rem; }
    .submit-btn:hover { background: #9a5208; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { border-radius: 2px; padding: 12px 16px; font-size: 14px; margin-bottom: 1rem; display: none; }
    .msg-success { background: var(--success-bg); color: var(--success); border: 1px solid #a3d4b0; }
    .msg-error { background: var(--error-bg); color: var(--error); border: 1px solid #e8b4b4; }
    .footer-rule { text-align: center; margin-top: 3rem; color: var(--rule); font-size: 13px; letter-spacing: 0.2em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,254,249,0.4); border-top-color: #fffef9; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  </style>
</head>
<body>
<div class="page-wrap">

  <header class="header">
    <div class="header-eyebrow">Est. 2026 &bull; Back of the Office</div>
    <h1 class="header-title">The Tipsy<br><span>Column</span></h1>
    <div class="header-tagline">You didn't hear it from us</div>
  </header>

  <div id="msg-success" class="msg msg-success"></div>
  <div id="msg-error" class="msg msg-error"></div>

  <div class="card">
    <div class="card-title"><span>✦</span> Your name</div>
    <label class="field-label" for="person-name">First name</label>
    <input type="text" id="person-name" placeholder="e.g. John" autocomplete="given-name" />
  </div>

  <div class="card">
    <div class="card-title"><span>✦</span> From the grill</div>

    <div class="menu-item">
      <div class="menu-item-header">
        <div class="menu-item-name">Burger</div>
        <div class="menu-item-price">$3.50 each</div>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="change('burger',-1)" aria-label="Remove burger">−</button>
          <span class="qty-val" id="qty-burger">0</span>
          <button class="qty-btn" onclick="change('burger',1)" aria-label="Add burger">+</button>
        </div>
      </div>
      <div class="options-row" id="opts-burger" style="display:none">
        <label class="option-chip"><input type="checkbox" id="cheese-burger" /> <span>Add cheese</span></label>
        <label class="option-chip"><input type="checkbox" id="toast-burger" /> <span>Toast the bun</span></label>
      </div>
    </div>

    <div class="menu-item">
      <div class="menu-item-header">
        <div class="menu-item-name">Sausage</div>
        <div class="menu-item-price">$3.50 each</div>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <div class="qty-control">
          <button class="qty-btn" onclick="change('sausage',-1)" aria-label="Remove sausage">−</button>
          <span class="qty-val" id="qty-sausage">0</span>
          <button class="qty-btn" onclick="change('sausage',1)" aria-label="Add sausage">+</button>
        </div>
      </div>
      <div class="options-row" id="opts-sausage" style="display:none">
        <label class="option-chip"><input type="checkbox" id="cheese-sausage" /> <span>Add cheese</span></label>
        <label class="option-chip"><input type="checkbox" id="toast-sausage" /> <span>Toast the bun</span></label>
      </div>
    </div>

  </div>

  <div class="summary" id="order-summary">
    <div id="summary-lines"></div>
    <hr class="summary-divider" />
    <div class="summary-total">
      <span>Total</span>
      <span id="summary-total-val">$0.00</span>
    </div>
  </div>

  <button class="submit-btn" id="submit-btn" onclick="submitOrder()">Place my order →</button>

  <div class="footer-rule">◆ &nbsp; ◆ &nbsp; ◆</div>
</div>

<script>
  // !! REPLACE THIS with your Google Apps Script Web App URL after setup !!
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzNV5bSswvNnbCasbYOMplN7zZHY1QZOmHvTmaLUJaDjSU-1Fj7_xQsq5-C_h_ix_WN/exec';

  const prices = { burger: 3.50, sausage: 3.50 };
  const qty = { burger: 0, sausage: 0 };

  function change(item, delta) {
    qty[item] = Math.max(0, qty[item] + delta);
    document.getElementById('qty-' + item).textContent = qty[item];
    document.getElementById('opts-' + item).style.display = qty[item] > 0 ? 'flex' : 'none';
    if (qty[item] === 0) {
      document.getElementById('cheese-' + item).checked = false;
      document.getElementById('toast-' + item).checked = false;
    }
    updateSummary();
  }

  function updateSummary() {
    const labels = { burger: 'Burger', sausage: 'Sausage' };
    let total = 0, hasAny = false, lines = '';
    ['burger','sausage'].forEach(k => {
      const q = qty[k];
      if (q > 0) {
        hasAny = true;
        const sub = q * prices[k];
        total += sub;
        lines += `<div class="summary-row"><span>${q}× ${labels[k]}</span><span>$${sub.toFixed(2)}</span></div>`;
        const extras = [];
        if (document.getElementById('cheese-' + k).checked) extras.push('cheese');
        if (document.getElementById('toast-' + k).checked) extras.push('toasted bun');
        if (extras.length) lines += `<div class="summary-row detail"><span>↳ ${extras.join(', ')}</span></div>`;
      }
    });
    document.getElementById('summary-lines').innerHTML = lines;
    document.getElementById('summary-total-val').textContent = '$' + total.toFixed(2);
    document.getElementById('order-summary').style.display = hasAny ? 'block' : 'none';
  }

  document.addEventListener('change', function(e) {
    if (e.target.type === 'checkbox') updateSummary();
  });

  async function submitOrder() {
    const name = document.getElementById('person-name').value.trim();
    if (!name) { document.getElementById('person-name').focus(); showMsg('error', 'Please enter your name.'); return; }
    const items = Object.keys(qty).filter(k => qty[k] > 0);
    if (!items.length) { showMsg('error', 'Please select at least one item.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Placing order...';

    const order = {
      name,
      burgers: qty.burger,
      burgerCheese: document.getElementById('cheese-burger').checked ? 'Yes' : 'No',
      burgerToasted: document.getElementById('toast-burger').checked ? 'Yes' : 'No',
      sausages: qty.sausage,
      sausageCheese: document.getElementById('cheese-sausage').checked ? 'Yes' : 'No',
      sausageToasted: document.getElementById('toast-sausage').checked ? 'Yes' : 'No',
      total: items.reduce((s, k) => s + qty[k] * prices[k], 0).toFixed(2),
      timestamp: new Date().toLocaleString('en-CA', { timeZone: 'America/Toronto' })
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(order)
      });
      showMsg('success', '✓ Order received — see you Friday!');
      ['burger','sausage'].forEach(k => {
        qty[k] = 0;
        document.getElementById('qty-' + k).textContent = 0;
        document.getElementById('opts-' + k).style.display = 'none';
        document.getElementById('cheese-' + k).checked = false;
        document.getElementById('toast-' + k).checked = false;
      });
      document.getElementById('person-name').value = '';
      document.getElementById('order-summary').style.display = 'none';
      btn.style.display = 'none';
    } catch(e) {
      showMsg('error', 'Something went wrong. Please try again.');
      btn.disabled = false;
      btn.innerHTML = 'Place my order →';
    }
  }

  function showMsg(type, text) {
    ['success','error'].forEach(t => {
      const el = document.getElementById('msg-' + t);
      el.style.display = t === type ? 'block' : 'none';
      if (t === type) el.textContent = text;
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
